[package]
name = "tasma-macos"
version = "0.0.0"
edition = "2024"
# `window_url` is a let chain, which edition 2024 accepts from 1.88 on. Without
# the floor an earlier toolchain meets a syntax error rather than a version one.
rust-version = "1.88"
publish = false

# The Dock and Command-Tab read the executable name when the binary runs
# unbundled, so a development run names itself the same as the packaged app.
[[bin]]
name = "Tasma"
path = "src/main.rs"

[features]
# Tauri reads dev mode from this feature rather than from the build profile, and
# embeds the bundle only outside dev mode. Every run meant to serve the bundle
# passes it; without it the resolver reads frontendDist off disk instead, which
# a packaged app has none of.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
# Both Tauri crates are written in the form the Tauri CLI rewrites them to on
# every `tauri build` and `tauri dev`, so a build leaves the manifest unchanged.
tauri-build = { version = "2", features = [] }

[dependencies]
# `setsid`, the walk that opens the log's directory one component at a time, the
# open flags that refuse a link or a pipe at the window record, and the session
# id and the named pipe that tests make. The standard library exposes none of
# them.
libc = "0.2"
# The traversal guard reads the decoded path, because Tauri's resolver decodes
# before it looks a name up.
percent-encoding = "2"
# default-features off: the daemon is reached over loopback HTTP, so no TLS
# stack, no HTTP/2 and no proxy resolution are needed.
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The form the Tauri CLI rewrites it to, as with `tauri-build`.
tauri = { version = "2", features = [] }
# The tick the readiness wait holds on. Tauri's own runtime is tokio, and it
# enables no timer of its own, so the feature is named here rather than left to
# whatever another dependency happens to turn on.
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
# The mock runtime, which the asset tests drive. Resolver 3 keeps the feature
# out of a build that needs no dev dependency.
tauri = { version = "2", features = ["test"] }

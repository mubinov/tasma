packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions; packages reference
# them with "catalog:".
catalog:
  # Exact, and they move together: the adapter pins the ACP SDK and zod to
  # these exact versions, so the daemon shares one copy of each with it.
  "@agentclientprotocol/claude-agent-acp": 0.89.1
  "@agentclientprotocol/sdk": 1.8.0
  "@assistant-ui/react": 0.15.26
  "@assistant-ui/react-markdown": 0.14.20
  "@base-ui/react": ^1.7.0
  "@eslint-react/eslint-plugin": ^5.18.6
  "@eslint/js": ^10.0.1
  "@fontsource/inter": ^5.3.0
  "@fontsource/inter-tight": ^5.3.0
  "@fontsource/jetbrains-mono": ^5.3.0
  "@phosphor-icons/react": ^2.1.10
  "@stylistic/eslint-plugin": ^5.10.0
  "@tailwindcss/vite": ^4.3.0
  "@tanstack/react-query": ^5.102.0
  "@tanstack/react-router": ^1.170.0
  "@tanstack/react-virtual": ^3.14.0
  "@tauri-apps/cli": ^2.11.4
  "@testing-library/dom": ^10.4.0
  "@testing-library/react": ^16.3.0
  "@testing-library/user-event": ^14.6.0
  "@types/mdast": ^4.0.4
  "@types/node": ^24.0.0
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^6.1.0
  "@vitest/coverage-v8": ^4.1.11
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  diff: ^9.0.0
  eslint: ^10.9.1
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.0
  jsdom: ^30.0.0
  lucide-react: ^1.55.0
  mermaid: ^12.0.0
  micromark-util-sanitize-uri: ^2.0.1
  oxc-transform-react: ^0.145.0
  react: ^19.2.0
  react-dom: ^19.2.0
  react-markdown: ^10.1.0
  react-shiki: ^0.11.2
  remark-gfm: ^4.0.1
  # Exact: apps/web/src/kit is the output of this CLI version, and
  # pnpm kit:check compares the folder with the output of the installed one.
  shadcn: 4.21.4
  shiki: ^4.5.0
  tailwindcss: ^4.3.0
  tw-animate-css: ^1.4.0
  tw-shimmer: 0.4.13
  # Pinned to an exact version. typescript-eslint declares a peer range of
  # typescript <6.1.0; the native port, 7.x, is outside it. A caret admits
  # 6.1.0 and a tilde admits a 6.0.x patch, so an exact version makes every
  # compiler change an explicit edit here. Remove the pin when
  # typescript-eslint supports 7.x.
  typescript: 6.0.3
  typescript-eslint: ^8.68.0
  vite: ^8.2.0
  vitest: ^4.1.11
  # The floor is the version the format module is tested against; an older
  # release inside the range is not.
  yaml: ^2.9.0
  # Exact: see @agentclientprotocol/claude-agent-acp.
  zod: 4.6.5
  zustand: ^5.0.0

# Links an internal package from the workspace when the local version satisfies
# the declared range. On a mismatch pnpm still falls back to the public
# registry, so internal dependencies use the workspace: protocol, which links
# unconditionally (enforced by test/workspace.test.ts).
linkWorkspacePackages: true

# Repo-wide supply-chain guard: a dependency version must be at least
# 7 days old (10080 minutes) before pnpm will install it.
minimumReleaseAge: 10080

# An empty allow list states pnpm's own deny-all default rather than adding to
# it: no dependency runs an install script until it is named here. It does not
# cover the prebuilt .node binaries vite and vitest load at build time, which
# reach the process without an install script.
allowBuilds: {}

# The platform binaries of the Agent SDK, a dependency of claude-agent-acp. The
# daemon runs the user's own `claude` through CLAUDE_CODE_EXECUTABLE, so the
# bundled copy (over 200 MB per platform) is never installed.
ignoredOptionalDependencies:
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl"
  - "@anthropic-ai/claude-agent-sdk-linux-x64"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64"
  - "@anthropic-ai/claude-agent-sdk-win32-x64"

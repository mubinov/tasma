packages:
  - apps/*
  - packages/*

# Single source of truth for shared dependency versions; packages reference
# them with "catalog:".
catalog:
  "@types/node": ^24.0.0
  "@vitest/coverage-v8": ^4.1.11
  # Pinned to an exact version. typescript-eslint, which this workspace does
  # not install yet, declares a peer range of typescript <6.1.0; the native
  # port, 7.x, is outside it. A caret admits 6.1.0 and a tilde admits a 6.0.x
  # patch, so an exact version makes every compiler change an explicit edit
  # here. Remove the pin when typescript-eslint supports 7.x.
  typescript: 6.0.3
  vitest: ^4.1.11
  # The floor is the version the format module is tested against; an older
  # release inside the range is not.
  yaml: ^2.9.0

# Links an internal package from the workspace when the local version satisfies
# the declared range. On a mismatch pnpm still falls back to the public
# registry, so internal dependencies use the workspace: protocol, which links
# unconditionally (enforced by test/workspace.test.ts).
linkWorkspacePackages: true

# Repo-wide supply-chain guard: a dependency version must be at least
# 7 days old (10080 minutes) before pnpm will install it.
minimumReleaseAge: 10080
